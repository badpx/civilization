<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌍 文明纪元 - Age of Civilization</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="title" id="game-title">🌍 文明纪元</div>
      <div class="turn-info" id="turn-display">回合 0</div>
      <div class="controls">
        <button class="btn btn-primary" id="btn-new-game" onclick="window.newGame()">新游戏</button>
        <button class="btn btn-success" id="btn-next-turn" onclick="window.nextTurn()">下一回合</button>
        <button class="btn btn-success" id="btn-auto" onclick="window.toggleAuto()">自动进行</button>
        <button class="btn btn-gold" id="btn-lang" onclick="window.toggleLang()">EN</button>
      </div>
    </header>

    <!-- Main Content -->
    <div id="main-content">
      <!-- Map -->
      <div id="map-container">
        <canvas id="game-map" width="750" height="500"></canvas>
      </div>

      <!-- Info Panel -->
      <div id="info-panel">
        <!-- Civilization Tabs -->
        <div id="civ-tabs">
          <div class="civ-tab" style="flex:1; text-align:center; padding:12px; color:var(--text-muted); font-size:13px;">暂无文明数据</div>
        </div>

        <!-- Civilization Detail -->
        <div id="civ-detail">
          <div style="padding:12px; text-align:center; color:var(--text-muted); font-size:13px;">选择一个文明查看详情</div>
        </div>

        <!-- God Intervention -->
        <div id="god-panel">
          <div class="panel-title"><span class="icon">⚡</span>神祇干预</div>
          <div class="god-controls">
            <select id="god-target" disabled>
              <option>无可用文明</option>
            </select>
            <div class="god-buttons">
              <button class="btn btn-success" disabled>赐福</button>
              <button class="btn btn-danger" disabled>天罚</button>
              <button class="btn btn-gold" disabled>神谕</button>
            </div>
          </div>
        </div>

        <!-- Event Log -->
        <div id="event-log">
          <div class="log-header" id="log-header">📜 事件日志</div>
          <div class="log-list" id="event-log-list">
            <div class="log-entry" style="color:var(--text-muted); text-align:center; padding:12px;">暂无事件</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Scripts -->
  <script src="js/websocket.js"></script>
  <script src="js/map.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
